<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVC YOUTH Valentine Booth 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Satisfy&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-bg: #ffccd5; --pink-light: #ffb3c1; --pink-dark: #ff4d6d;
            --red-love: #c9184a; --cream: #fff5f7; --white: #ffffff;
        }

        body {
            font-family: 'Mali', cursive; margin: 0; text-align: center; 
            min-height: 100vh;
            background-color: var(--pink-bg);
            background-image: radial-gradient(circle at center, #fff 0%, var(--pink-bg) 70%);
            padding: 30px 20px; 
            box-sizing: border-box; color: #333;
        }

        .container { 
            width: 100%; max-width: 550px; 
            margin: 0 auto; 
            position: relative; z-index: 1; 
        }
        
        .hidden { display: none !important; }
        .active { display: block !important; }

        h1 { font-family: 'Satisfy', cursive; color: var(--red-love); font-size: 3.8rem; margin: 0 0 10px 0; text-shadow: 2px 2px 0 var(--white); line-height: 1.1; }
        .subtitle { color: var(--red-love); font-weight: 700; margin-bottom: 30px; font-size: 1.2rem; letter-spacing: 1px; }
        .section-title { color: #333; margin-bottom: 15px; font-weight: 700; font-size: 1.1rem; text-align: left; }

        .content-box { 
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px; 
            padding: 30px; 
            box-shadow: 0 10px 40px rgba(201, 24, 74, 0.15); 
            margin-bottom: 25px; 
        }

        .color-selector { display: flex; gap: 12px; margin-bottom: 25px; justify-content: center; flex-wrap: wrap; }
        .color-option { width: 45px; height: 45px; border-radius: 50%; border: 3px solid white; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .color-option.selected { border-color: var(--red-love); transform: scale(1.15); box-shadow: 0 6px 12px rgba(201, 24, 74, 0.2); }

        .layout-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .layout-btn { background: #fff; border: 2px solid var(--pink-light); border-radius: 15px; padding: 15px 10px; cursor: pointer; font-weight: 700; color: var(--red-love); font-family: 'Mali', cursive; transition: 0.2s; font-size: 1rem; }
        .layout-btn:hover { background: var(--pink-bg); transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }

        /* --- 🔥 กรอบรูป Photo Booth (ธีมวาเลนไทน์ & จัดกลางเป๊ะๆ) 🔥 --- */
        .frame-outer-wrapper {
            width: 100%; display: flex; justify-content: center; margin-bottom: 30px;
        }

        .frame-container {
            /* สีพื้นหลังกระดาษ */
            background-color: #fff0f5; 
            
            /* 🔥 กรอบวาเลนไทน์: ขอบหนาสีชมพู + เงาสีแดง 2 ชั้น 🔥 */
            border: 6px solid var(--pink-dark);
            border-radius: 15px;
            box-shadow:
                0 0 0 5px var(--pink-light), /* เงาชั้นที่ 1 ทำหน้าที่เหมือนขอบอีกชั้น */
                0 10px 30px rgba(201, 24, 74, 0.3); /* เงาหลักฟุ้งๆ */
            
            /* การจัดวางเนื้อหาข้างใน */
            padding: 25px; /* ระยะห่างขอบกระดาษถึงรูป */
            box-sizing: border-box;
            display: flex; justify-content: center; align-items: center;
            position: relative;
            width: auto; max-width: 100%;
        }

        /* Wrapper สำหรับจัดกลุ่มรูป */
        .photo-grid-wrapper {
            /* 🔥 กำหนดความกว้างตายตัว เพื่อให้จัดกลางได้แน่นอน! 🔥 */
            width: 320px; /* ขนาดกำลังดีสำหรับมือถือ */
            max-width: 100%;
            position: relative; z-index: 5;
            margin: auto; /* จัดกึ่งกลาง */
        }

        /* --- รูปแบบ Grid --- */
        .photo-grid { display: grid; width: 100%; margin: 0 auto; }
        
        .grid-v2 { grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-v2 .photo-slot { aspect-ratio: 3 / 4; }

        .grid-v4 { grid-template-columns: 1fr; gap: 8px; } 
        .grid-v4 .photo-slot { aspect-ratio: 4 / 3; }

        .grid-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-grid .photo-slot { aspect-ratio: 4 / 3; }

        .photo-slot { 
            width: 100%; height: auto; background-size: cover; background-position: center; 
            border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 4px;
        }

        /* --- อีโมจิ (ไม่เอียง) --- */
        .decor { position: absolute; font-size: 40px; z-index: 10; filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.15)); line-height: 1; transform: none !important; }
        .decor-tl { top: -18px; left: -18px; }
        .decor-tr { top: -18px; right: -18px; }
        .decor-bl { bottom: -18px; left: -18px; }
        .decor-br { bottom: -18px; right: -18px; }

        .camera-wrapper { position: relative; width: 100%; padding-bottom: 133.33%; background: #000; border-radius: 20px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; color: white; font-weight: 900; text-shadow: 4px 4px 0 var(--red-love); display: none; }

        .btn-primary { background: linear-gradient(45deg, var(--pink-dark), var(--red-love)) !important; color: white !important; border: none !important; padding: 18px 30px; border-radius: 50px; font-size: 1.3rem; font-weight: 700; cursor: pointer; width: 100%; display: inline-block; box-sizing: border-box; margin-top: 15px; box-shadow: 0 5px 15px rgba(201, 24, 74, 0.4); font-family: 'Mali', cursive; text-decoration: none; transition: 0.2s; }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(201, 24, 74, 0.6); }
        .btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(201, 24, 74, 0.4) !important; }
        .btn-primary:disabled { background: #ccc !important; box-shadow: none !important; color: #666 !important; cursor: not-allowed; }
        
        .emoji-options { display: flex; justify-content: center; gap: 20px; font-size: 2.2rem; margin: 20px 0; cursor: pointer; }
        .emoji-btn { transition: 0.2s; display: inline-block; }
        .emoji-btn:hover { transform: scale(1.2); }
    </style>
</head>
<body>

    <div class="container">
        <section id="step-welcome" class="active">
            <h1>CVC YOUTH</h1>
            <p class="subtitle">✨ Valentine Photo Booth 2026 ✨</p>
            <div class="content-box">
                <p class="section-title">1. เลือกสีพื้นหลัง</p>
                <div class="color-selector">
                    <div class="color-option selected" style="background-color: #ffccd5;" onclick="selectColor(this, '#ffccd5')"></div>
                    <div class="color-option" style="background-color: #ffdfba;" onclick="selectColor(this, '#ffdfba')"></div>
                    <div class="color-option" style="background-color: #ffffba;" onclick="selectColor(this, '#ffffba')"></div>
                    <div class="color-option" style="background-color: #baffc9;" onclick="selectColor(this, '#baffc9')"></div>
                    <div class="color-option" style="background-color: #bae1ff;" onclick="selectColor(this, '#bae1ff')"></div>
                    <div class="color-option" style="background-color: #eecbff;" onclick="selectColor(this, '#eecbff')"></div>
                    <div class="color-option" style="background-color: #ffffff;" onclick="selectColor(this, '#ffffff')"></div>
                    <div class="color-option" style="background-color: #333333;" onclick="selectColor(this, '#333333')"></div>
                </div>
                <p class="section-title">2. เลือกรูปแบบ</p>
                <div class="layout-selector">
                    <button class="layout-btn" onclick="startCamera('v2', 2)">แบบ 2 ช่อง</button>
                    <button class="layout-btn" onclick="startCamera('v4', 4)">แบบ 4 ช่องเรียง</button>
                    <button class="layout-btn" onclick="startCamera('grid', 4)" style="grid-column: span 2;">แบบ 4 ช่อง (ตาราง)</button>
                </div>
            </div>
        </section>

        <section id="step-camera" class="hidden">
            <div class="content-box">
                <div class="camera-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <div id="countdown"></div>
                </div>
                <p id="status-text" style="font-weight: 700; color: var(--red-love); font-size: 1.2rem;">เตรียมตัวนะ... 📸</p>
            </div>
        </section>

        <section id="step-edit" class="hidden">
            <p class="section-title" style="text-align:center; margin-bottom: 20px;">✨ ได้รูปแล้ว! แต่งเลย ✨</p>
            
            <div class="frame-outer-wrapper">
                <div class="frame-container" id="preview-container">
                    <div id="photo-grid-wrapper" class="photo-grid-wrapper">
                        <div id="decor-tl" class="decor decor-tl"></div>
                        <div id="decor-tr" class="decor decor-tr"></div>
                        <div id="decor-bl" class="decor decor-bl"></div>
                        <div id="decor-br" class="decor decor-br"></div>
                        <div id="photo-grid" class="photo-grid"></div>
                    </div>
                </div>
            </div>
            
            <div class="content-box">
                <p class="section-title" style="text-align:center;">เลือกอีโมจิ</p>
                <div class="emoji-options">
                    <span class="emoji-btn" onclick="addEmoji('❤️')">❤️</span>
                    <span class="emoji-btn" onclick="addEmoji('🌹')">🌹</span>
                    <span class="emoji-btn" onclick="addEmoji('🎀')">🎀</span>
                    <span class="emoji-btn" onclick="addEmoji('🧸')">🧸</span>
                    <span class="emoji-btn" onclick="addEmoji('🍒')">🍒</span>
                    <span class="emoji-btn" onclick="addEmoji('')">❌</span>
                </div>

                <button class="btn-primary" id="save-btn" onclick="generateFinal()">บันทึกรูปภาพ 💖</button>
                <button style="background:none; border:none; color:var(--pink-dark); cursor:pointer; margin-top:20px; text-decoration:underline; font-weight:700;" onclick="location.reload()">ถ่ายใหม่</button>
            </div>
        </section>

        <section id="step-result" class="hidden">
            <div class="content-box">
                <h2 style="color:var(--red-love); margin-bottom: 10px;">🎉 รูปมาแล้ววว! 🎉</h2>
                
                <div id="qr-section" class="hidden" style="margin-bottom: 25px;">
                    <p id="qr-note" style="margin-top:0; font-size:1rem; color:var(--pink-dark); font-weight:700;">📱 สแกนเพื่อโหลดรูปลงมือถือ</p>
                    <div id="qrcode" style="display:inline-block; padding:15px; background:white; border-radius:20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);"></div>
                </div>
                
                <div class="frame-outer-wrapper">
                    <div id="final-image-show"></div>
                </div>
                
                <a id="download-link" class="btn-primary">ดาวน์โหลดรูปนี้</a>
                <button style="background:none; border:none; color:var(--pink-dark); cursor:pointer; margin-top:20px; text-decoration:underline; font-weight:700;" onclick="location.reload()">กลับไปหน้าแรก</button>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        let photos = [];
        let stream = null;
        let selectedColor = '#ffccd5';
        let currentLayout = { count: 4, class: 'grid-grid' };

        function switchStep(hideId, showId) {
            const hideEl = document.getElementById(hideId);
            const showEl = document.getElementById(showId);
            if(hideEl) { hideEl.classList.remove('active'); hideEl.classList.add('hidden'); }
            if(showEl) { showEl.classList.remove('hidden'); showEl.classList.add('active'); }
            window.scrollTo(0, 0); 
        }

        function selectColor(el, color) {
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            selectedColor = color;
        }

        async function startCamera(type, count) {
            currentLayout = { count, class: type === 'grid' ? 'grid-grid' : (type === 'v4' ? 'grid-v4' : 'grid-v2') };
            switchStep('step-welcome', 'step-camera');

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } });
                document.getElementById('video').srcObject = stream;
                
                const cd = document.getElementById('countdown');
                photos = [];
                for (let i = 1; i <= count; i++) {
                    document.getElementById('status-text').innerText = `รูปที่ ${i} / ${count} ยิ้มหวานนน! 😄`;
                    await new Promise(r => {
                        let c = 3; cd.innerText = c; cd.style.display = 'block';
                        const t = setInterval(() => {
                            c--; if(c > 0) cd.innerText = c;
                            else { clearInterval(t); cd.innerText = "📸"; r(); }
                        }, 1000);
                    });
                    capture();
                    await new Promise(r => setTimeout(r, 600));
                    cd.style.display = 'none';
                }
                stream.getTracks().forEach(t => t.stop());
                showEdit();
            } catch (e) { alert("เกิดข้อผิดพลาดกับกล้อง! ลองรีเฟรชหน้าเว็บใหม่นะครับ"); location.reload(); }
        }

        function capture() {
            const v = document.getElementById('video');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            const ctx = c.getContext('2d');
            ctx.translate(c.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(v, 0, 0);
            photos.push(c.toDataURL('image/jpeg', 0.9));
        }

        function showEdit() {
            switchStep('step-camera', 'step-edit');
            document.getElementById('preview-container').style.backgroundColor = selectedColor;
            
            const grid = document.getElementById('photo-grid');
            grid.className = 'photo-grid ' + currentLayout.class;
            grid.innerHTML = photos.map(p => `<div class="photo-slot" style="background-image:url(${p})"></div>`).join('');
            
            addEmoji('❤️');
        }

        function addEmoji(e) {
            ['tl','tr','bl','br'].forEach(pos => document.getElementById('decor-'+pos).innerText = e);
        }

        async function generateFinal() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "กำลังปริ้นท์รูป... 🖨️"; 
            btn.disabled = true;

            try {
                const canvas = await html2canvas(document.getElementById('preview-container'), { scale: 2, useCORS: true, backgroundColor: null });
                const imageData = canvas.toDataURL('image/jpeg', 0.95);

                switchStep('step-edit', 'step-result');
                document.getElementById('final-image-show').innerHTML = `<p style="color:gray;">กำลังโหลด...</p>`;

                try {
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: imageData })
                    });
                    
                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(errText);
                    }

                    const data = await res.json();
                    
                    document.getElementById('final-image-show').innerHTML = `<img src="${data.url}" style="width:100%; border-radius:12px; box-shadow: 0 5px 20px rgba(0,0,0,0.15);">`;
                    document.getElementById('download-link').href = data.url;
                    document.getElementById('download-link').download = `CVC_PhotoBooth_${Date.now()}.jpg`;

                    document.getElementById('qr-note').innerText = "📱 สแกนเพื่อโหลดรูปลงมือถือ";
                    document.getElementById("qrcode").innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), { text: data.url, width: 150, height: 150, colorDark : "#c9184a", colorLight : "#ffffff" });
                    document.getElementById('qr-section').classList.remove('hidden');

                } catch (err) {
                    alert("⚠️ เซิร์ฟเวอร์มีปัญหาเล็กน้อย (แต่รูปเซฟได้ปกตินะ!)");
                    console.error("Upload Error:", err);

                    document.getElementById('final-image-show').innerHTML = `<img src="${imageData}" style="width:100%; border-radius:12px; box-shadow: 0 5px 20px rgba(0,0,0,0.15);">`;
                    document.getElementById('download-link').href = imageData;
                    document.getElementById('download-link').download = `CVC_PhotoBooth_${Date.now()}.jpg`;
                    
                    document.getElementById('qr-note').innerHTML = "สแกนเพื่อแชร์เว็บให้เพื่อนเล่น!";
                    document.getElementById("qrcode").innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 150, height: 150, colorDark : "#333", colorLight : "#ffffff" });
                    document.getElementById('qr-section').classList.remove('hidden');
                }

            } catch (e) {
                alert("เกิดข้อผิดพลาดในการสร้างรูปครับ: " + e.message);
                switchStep('step-result', 'step-edit');
                btn.innerText = "บันทึกรูปภาพ 💖"; 
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
