<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVC YOUTH Valentine Booth 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Satisfy&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-bg: #ffccd5; --pink-light: #ffb3c1; --pink-dark: #ff4d6d;
            --red-love: #c9184a; --cream: #fff5f7; --white: #ffffff;
        }

        body {
            font-family: 'Mali', cursive; margin: 0; text-align: center; display: flex; justify-content: center; min-height: 100vh;
            background-color: var(--pink-bg);
            background-image: repeating-linear-gradient(45deg, var(--pink-light) 0, var(--pink-light) 2px, var(--pink-bg) 2px, var(--pink-bg) 10px);
            padding-top: 20px; box-sizing: border-box; color: #333;
            touch-action: none; /* กันหน้าจอเด้งตอนลากสติกเกอร์ */
        }

        .container { width: 100%; max-width: 500px; padding: 20px; box-sizing: border-box; position: relative; z-index: 1; margin-top: 10px; }
        .hidden { display: none !important; }
        .active { display: block !important; }

        h1 { font-family: 'Satisfy', cursive; color: var(--red-love); font-size: 3.5rem; margin: 0; text-shadow: 2px 2px 0 var(--white); line-height: 1.1; }
        .subtitle { color: var(--red-love); font-weight: 700; margin-bottom: 20px; font-size: 1.1rem; }
        .section-title { color: #333; margin-bottom: 15px; font-weight: 700; font-size: 1.1rem; text-align: left; }

        .content-box { background: var(--cream); border-radius: 20px; padding: 20px; border: 4px solid var(--pink-dark); box-shadow: 0 10px 30px rgba(201, 24, 74, 0.2); }

        /* --- เลือกสีพื้นหลัง --- */
        .color-selector { display: flex; gap: 12px; margin-bottom: 25px; justify-content: center; flex-wrap: wrap; }
        .color-option { width: 45px; height: 45px; border-radius: 50%; border: 4px solid white; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .color-option.selected { border-color: var(--red-love); transform: scale(1.15); box-shadow: 0 6px 12px rgba(201, 24, 74, 0.3); }

        .layout-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .layout-btn { background: #fff; border: 2px solid var(--pink-light); border-radius: 10px; padding: 15px 10px; cursor: pointer; font-weight: 700; color: var(--red-love); font-family: 'Mali', cursive; transition: 0.2s; }
        .layout-btn:hover { background: var(--pink-bg); transform: translateY(-3px); }

        /* --- 🔥 กรอบพรีวิว (แก้ไขการจัดกึ่งกลางใหม่) 🔥 --- */
        .frame-container {
            aspect-ratio: 2 / 3; /* อัตราส่วนกรอบนอกรวม */
            width: 100%; max-width: 420px; margin: 0 auto 20px auto;
            background-color: #ffccd5; border-radius: 10px; position: relative; border: 2px solid var(--pink-dark);
            /* ใช้ Flexbox สั่งให้ของข้างในอยู่ตรงกลางเป๊ะๆ */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* เว้นขอบเล็กน้อยเพื่อความสวยงาม */
            box-sizing: border-box;
            transition: background-color 0.3s ease;
            overflow: hidden;
        }

        /* Wrapper เป็นตัวกำหนดขอบเขตกลุ่มรูปภาพ */
        .photo-grid-wrapper {
            /* กำหนดสัดส่วนของกลุ่มรูปภาพ (เช่น 3:4 ให้ดูเป็นทรงตั้งสวยๆ) */
            aspect-ratio: 3 / 4;
            /* ให้ขยายเต็มความสูงที่ container อนุญาต โดยรักษาอัตราส่วน */
            width: auto;
            height: 100%;
            max-width: 100%; /* ห้ามกว้างเกิน container */
            position: relative; z-index: 5;
            display: flex; /* เพื่อให้ grid ข้างในขยายเต็ม */
        }

        /* --- 🔥 รูปแบบ Grid (ปรับให้เต็มพื้นที่ wrapper) --- */
        .photo-grid { 
            display: grid; width: 100%; height: 100%;
        }
        
        /* 1. แบบ 2 ช่อง: ซ้ายขวา */
        .grid-v2 { grid-template-columns: 1fr 1fr; gap: 15px; }
        .grid-v2 .photo-slot { aspect-ratio: 3 / 4; width: 100%; height: auto; }

        /* 2. แบบ 4 ช่องเรียง: บนลงล่าง */
        .grid-v4 { grid-template-columns: 1fr; grid-template-rows: repeat(4, 1fr); gap: 10px; } 
        .grid-v4 .photo-slot { width: 100%; height: 100%; }

        /* ✅ 3. แบบ 4 ช่องตาราง: 2x2 (แก้ใหม่ให้เต็มพื้นที่) */
        .grid-grid { 
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: repeat(2, 1fr); /* บังคับ 2 แถวเต็มความสูง */
            gap: 10px; 
        }
        /* ให้ยืดตามแม่ ไม่ต้องกำหนด aspect-ratio เอง */
        .grid-grid .photo-slot { width: 100%; height: 100%; }

        .photo-slot { 
            background-size: cover; background-position: center; 
            border: 4px solid white; box-shadow: 0 3px 6px rgba(0,0,0,0.15); border-radius: 6px;
        }

        /* --- สติกเกอร์ --- */
        .sticker-palette-container { background: white; padding: 10px; border-radius: 15px; border: 2px solid var(--pink-light); margin-bottom: 15px; }
        .sticker-palette { display: flex; gap: 15px; overflow-x: auto; padding: 5px; scrollbar-width: none; }
        .sticker-palette::-webkit-scrollbar { display: none; }
        .sticker-option { font-size: 2.5rem; cursor: pointer; transition: 0.2s; user-select: none; filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.1)); }
        .sticker-option:hover { transform: scale(1.2) rotate(5deg); }
        .draggable-sticker { position: absolute; font-size: 3.5rem; z-index: 20; cursor: move; user-select: none; filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.2)); touch-action: none; }

        .camera-wrapper { position: relative; width: 100%; padding-bottom: 133.33%; background: #000; border-radius: 15px; overflow: hidden; margin-bottom: 15px; border: 4px solid var(--pink-dark); }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; color: white; font-weight: 900; text-shadow: 4px 4px 0 var(--red-love); display: none; }

        .btn-primary { background: linear-gradient(to bottom, var(--pink-dark), var(--red-love)) !important; color: white !important; border: 2px solid var(--red-love) !important; padding: 15px 20px; border-radius: 50px; font-size: 1.2rem; font-weight: 700; cursor: pointer; width: 100%; display: inline-block; box-sizing: border-box; margin-top: 10px; box-shadow: 0 4px 0 #8B0000; font-family: 'Mali', cursive; text-decoration: none; }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 0 0 #8B0000 !important; }
        .btn-primary:disabled { background: #ccc !important; border-color: #999 !important; box-shadow: none !important; color: #666 !important; }
    </style>
</head>
<body>

    <div class="container">
        <section id="step-welcome" class="active">
            <h1>CVC YOUTH</h1>
            <p class="subtitle">💖 Valentine Photo Booth 2026 💖</p>
            <div class="content-box">
                <p class="section-title">1. เลือกสีพื้นหลัง</p>
                <div class="color-selector">
                    <div class="color-option selected" style="background-color: #ffccd5;" onclick="selectColor(this, '#ffccd5')"></div>
                    <div class="color-option" style="background-color: #ffdfba;" onclick="selectColor(this, '#ffdfba')"></div>
                    <div class="color-option" style="background-color: #ffffba;" onclick="selectColor(this, '#ffffba')"></div>
                    <div class="color-option" style="background-color: #baffc9;" onclick="selectColor(this, '#baffc9')"></div>
                    <div class="color-option" style="background-color: #bae1ff;" onclick="selectColor(this, '#bae1ff')"></div>
                    <div class="color-option" style="background-color: #eecbff;" onclick="selectColor(this, '#eecbff')"></div>
                    <div class="color-option" style="background-color: #ffffff;" onclick="selectColor(this, '#ffffff')"></div>
                    <div class="color-option" style="background-color: #333333;" onclick="selectColor(this, '#333333')"></div>
                </div>
                <p class="section-title">2. เลือกรูปแบบ</p>
                <div class="layout-selector">
                    <button class="layout-btn" onclick="startCamera('v2', 2)">แบบ 2 ช่อง</button>
                    <button class="layout-btn" onclick="startCamera('v4', 4)">แบบ 4 ช่องเรียง</button>
                    <button class="layout-btn" onclick="startCamera('grid', 4)" style="grid-column: span 2;">แบบ 4 ช่อง (ตาราง)</button>
                </div>
            </div>
        </section>

        <section id="step-camera" class="hidden">
            <div class="content-box">
                <div class="camera-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <div id="countdown"></div>
                </div>
                <p id="status-text" style="font-weight: 700; color: var(--red-love);">เตรียมตัวนะ...</p>
            </div>
        </section>

        <section id="step-edit" class="hidden">
            <div class="frame-container" id="preview-container">
                <div id="photo-grid-wrapper" class="photo-grid-wrapper">
                    <div id="photo-grid" class="photo-grid"></div>
                </div>
                <div id="sticker-layer" style="position:absolute; top:0; left:0; width:100%; height:100%; z-index:20; pointer-events:none;"></div>
            </div>
            
            <div class="content-box">
                <p class="section-title" style="text-align:center; margin-top:0;">จิ้มสติกเกอร์ แล้วลากแต่งรูปได้เลย!</p>
                <div class="sticker-palette-container">
                    <div class="sticker-palette">
                        <span class="sticker-option" onclick="addSticker('💖')">💖</span>
                        <span class="sticker-option" onclick="addSticker('🧸')">🧸</span>
                        <span class="sticker-option" onclick="addSticker('🎀')">🎀</span>
                        <span class="sticker-option" onclick="addSticker('🌹')">🌹</span>
                        <span class="sticker-option" onclick="addSticker('✨')">✨</span>
                        <span class="sticker-option" onclick="addSticker('🥺')">🥺</span>
                        <span class="sticker-option" onclick="addSticker('🥰')">🥰</span>
                        <span class="sticker-option" onclick="addSticker('🎉')">🎉</span>
                        <span class="sticker-option" onclick="addSticker('🎂')">🎂</span>
                        <span class="sticker-option" onclick="addSticker('🍒')">🍒</span>
                    </div>
                </div>
                <button style="background:#eee; border:none; color:#666; padding: 8px 15px; border-radius:20px; cursor:pointer; margin-bottom: 15px; font-family: 'Mali';" onclick="clearStickers()">❌ ลบสติกเกอร์ทั้งหมด</button>

                <button class="btn-primary" id="save-btn" onclick="generateFinal()">บันทึกรูปภาพ 💌</button>
                <button style="background:none; border:none; color:gray; cursor:pointer; margin-top:15px; text-decoration:underline;" onclick="location.reload()">เริ่มใหม่</button>
            </div>
        </section>

        <section id="step-result" class="hidden">
            <div class="content-box">
                <h2 style="color:var(--red-love); margin-bottom: 5px;">เย้! ได้รูปแล้ว</h2>
                <div id="qr-section" class="hidden">
                    <p id="qr-note" style="margin-top:0; font-size:0.9rem; color:var(--pink-dark);">สแกน QR Code นี้เพื่อโหลดรูปลงมือถือ</p>
                    <div id="qrcode" style="display:inline-block; padding:10px; background:white; border:2px solid var(--pink-dark); border-radius:10px; margin-bottom:15px;"></div>
                </div>
                <div id="final-image-show"></div>
                <a id="download-link" class="btn-primary">ดาวน์โหลดรูปนี้ลงเครื่อง</a>
                <button style="background:none; border:none; color:gray; cursor:pointer; margin-top:15px; text-decoration:underline;" onclick="location.reload()">ถ่ายอีกครั้ง</button>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        let photos = [];
        let stream = null;
        let selectedColor = '#ffccd5';
        let currentLayout = { count: 4, class: 'grid-grid' };
        
        let activeSticker = null;
        let initialX, initialY, currentX, currentY, xOffset = 0, yOffset = 0;

        function switchStep(hideId, showId) {
            const hideEl = document.getElementById(hideId);
            const showEl = document.getElementById(showId);
            if(hideEl) { hideEl.classList.remove('active'); hideEl.classList.add('hidden'); }
            if(showEl) { showEl.classList.remove('hidden'); showEl.classList.add('active'); }
        }

        function selectColor(el, color) {
            document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            selectedColor = color;
        }

        async function startCamera(type, count) {
            currentLayout = { count, class: type === 'grid' ? 'grid-grid' : (type === 'v4' ? 'grid-v4' : 'grid-v2') };
            switchStep('step-welcome', 'step-camera');

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } } });
                document.getElementById('video').srcObject = stream;
                
                const cd = document.getElementById('countdown');
                photos = [];
                for (let i = 1; i <= count; i++) {
                    document.getElementById('status-text').innerText = `ยิ้มมม! รูปที่ ${i} / ${count}`;
                    await new Promise(r => {
                        let c = 3; cd.innerText = c; cd.style.display = 'block';
                        const t = setInterval(() => {
                            c--; if(c > 0) cd.innerText = c;
                            else { clearInterval(t); cd.innerText = "📸"; r(); }
                        }, 1000);
                    });
                    capture();
                    await new Promise(r => setTimeout(r, 600));
                    cd.style.display = 'none';
                }
                stream.getTracks().forEach(t => t.stop());
                showEdit();
            } catch (e) { alert("กล้องมีปัญหาจ้า!"); location.reload(); }
        }

        function capture() {
            const v = document.getElementById('video');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            const ctx = c.getContext('2d');
            ctx.translate(c.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(v, 0, 0);
            photos.push(c.toDataURL('image/jpeg', 0.8));
        }

        function showEdit() {
            switchStep('step-camera', 'step-edit');
            document.getElementById('preview-container').style.backgroundColor = selectedColor;
            
            const grid = document.getElementById('photo-grid');
            grid.className = 'photo-grid ' + currentLayout.class;
            grid.innerHTML = photos.map(p => `<div class="photo-slot" style="background-image:url(${p})"></div>`).join('');
        }

        /* --- ระบบลากสติกเกอร์ --- */
        function addSticker(emoji) {
            const sticker = document.createElement('div');
            sticker.className = 'draggable-sticker';
            sticker.innerText = emoji;
            sticker.style.pointerEvents = 'auto'; 
            sticker.style.left = '50%';
            sticker.style.top = '50%';
            sticker.style.transform = `translate(-50%, -50%) rotate(${Math.random() * 30 - 15}deg)`;

            sticker.addEventListener('mousedown', dragStart, false);
            sticker.addEventListener('touchstart', dragStart, {passive: false});
            
            document.getElementById('sticker-layer').appendChild(sticker);
        }

        function clearStickers() { document.getElementById('sticker-layer').innerHTML = ''; }

        const container = document.getElementById('preview-container');
        container.addEventListener('mousemove', drag, false);
        container.addEventListener('touchmove', drag, {passive: false});
        container.addEventListener('mouseup', dragEnd, false);
        container.addEventListener('touchend', dragEnd, false);

        function dragStart(e) {
            if (e.target.classList.contains('draggable-sticker')) {
                activeSticker = e.target;
                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - xOffset;
                    initialY = e.touches[0].clientY - yOffset;
                } else {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                }
            }
        }

        function drag(e) {
            if (activeSticker) {
                e.preventDefault();
                if (e.type === "touchmove") {
                    currentX = e.touches[0].clientX - initialX;
                    currentY = e.touches[0].clientY - initialY;
                } else {
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                }
                xOffset = currentX; yOffset = currentY;
                const currentRotation = activeSticker.style.transform.match(/rotate\(([^)]+)\)/);
                const rotation = currentRotation ? currentRotation[0] : 'rotate(0deg)';
                activeSticker.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px)) ${rotation}`;
            }
        }

        function dragEnd(e) { initialX = currentX; initialY = currentY; activeSticker = null; }

        /* --- ระบบบันทึกรูปและดักจับ Error 404 --- */
        async function generateFinal() {
            const btn = document.getElementById('save-btn');
            btn.innerText = "กำลังอัปโหลด... ⏳"; 
            btn.disabled = true;
            activeSticker = null;

            try {
                const canvas = await html2canvas(document.getElementById('preview-container'), { scale: 1.5, useCORS: true });
                const imageData = canvas.toDataURL('image/jpeg', 0.85);

                switchStep('step-edit', 'step-result');
                document.getElementById('final-image-show').innerHTML = `<p style="color:gray;">กำลังเตรียมรูปภาพ...</p>`;

                try {
                    const res = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: imageData })
                    });
                    
                    if (!res.ok) {
                        const errText = await res.text();
                        throw new Error(`โค้ด Error: ${res.status}\n\nข้อความ: ${errText}`);
                    }

                    const data = await res.json();
                    
                    document.getElementById('final-image-show').innerHTML = `<img src="${data.url}" style="width:100%; border-radius:10px; border:3px solid var(--pink-dark);">`;
                    document.getElementById('download-link').href = data.url;
                    document.getElementById('download-link').download = `CVC_Valentine_${Date.now()}.jpg`;

                    document.getElementById('qr-note').innerText = "สแกน QR Code นี้เพื่อโหลดรูปลงมือถือ";
                    document.getElementById("qrcode").innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), { text: data.url, width: 140, height: 140, colorDark : "#c9184a", colorLight : "#ffffff" });
                    document.getElementById('qr-section').classList.remove('hidden');

                } catch (err) {
                    // 🔥 เด้ง Alert บอกปัญหา Error 404 ทันที 🔥
                    alert("⚠️ การอัปโหลดล้มเหลว!\n\nสาเหตุที่เซิร์ฟเวอร์พัง:\n" + err.message + "\n\n(เช็คชื่อโฟลเดอร์ 'api' ใน GitHub ให้ดีนะครับ!)");

                    document.getElementById('final-image-show').innerHTML = `<img src="${imageData}" style="width:100%; border-radius:10px; border:3px solid var(--pink-dark);">`;
                    document.getElementById('download-link').href = imageData;
                    document.getElementById('download-link').download = `CVC_Valentine_${Date.now()}.jpg`;
                    
                    document.getElementById('qr-note').innerHTML = "<span style='font-size:0.8rem; color:red;'>⚠️ เซิร์ฟเวอร์อัปโหลดพัง (แต่เซฟรูปได้ตามปกตินะครับ)</span><br><b>สแกน QR Code ด้านล่างเพื่อส่งเว็บให้เพื่อน!</b>";
                    document.getElementById("qrcode").innerHTML = "";
                    new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 120, height: 120, colorDark : "#666", colorLight : "#ffffff" });
                    document.getElementById('qr-section').classList.remove('hidden');
                }

            } catch (e) {
                alert("เกิดข้อผิดพลาดในการสร้างรูปครับ");
                switchStep('step-result', 'step-edit');
                btn.innerText = "บันทึกรูปภาพ 💌"; 
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
