<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVC YOUTH Valentine Booth 2026</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Satisfy&display=swap" rel="stylesheet">
    
    <style>
        /* --- ตั้งค่าสีหลัก (ธีมวาเลนไทน์) --- */
        :root {
            --pink-bg: #ffccd5;
            --pink-light: #ffb3c1;
            --pink-dark: #ff4d6d;
            --red-love: #c9184a;
            --cream: #fff5f7;
            --white: #ffffff;
        }

        body {
            font-family: 'Mali', cursive;
            margin: 0;
            text-align: center;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #333;
            background-color: var(--pink-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 0%, rgba(255, 255, 255, 0.4) 100%),
                repeating-linear-gradient(45deg, var(--pink-light) 0, var(--pink-light) 10px, var(--pink-bg) 10px, var(--pink-bg) 20px);
            padding-top: 20px; /* เพิ่มพื้นที่ด้านบนสุดของ Body */
        }

        .container { 
            width: 100%; 
            max-width: 500px; 
            padding: 25px; 
            box-sizing: border-box; 
            position: relative; 
            z-index: 1; 
            /* เพิ่มระยะห่างด้านบนเพื่อให้ไม่บังหัวข้อ */
            margin-top: 30px; 
        }
        
        .hidden { display: none !important; }
        .active { display: block !important; }

        h1 {
            font-family: 'Satisfy', cursive; color: var(--red-love); font-size: 3.5rem; 
            margin-bottom: 5px; margin-top: 10px; text-shadow: 2px 2px 0 var(--white); letter-spacing: 2px;
        }
        p { color: var(--red-love); font-weight: 700; margin-top: 0; font-size: 1.1rem; }

        .content-box {
            background: var(--cream); border-radius: 15px; padding: 20px;
            border: 4px solid var(--pink-dark); box-shadow: 0 10px 30px rgba(201, 24, 74, 0.2);
        }

        /* --- การเลือกพื้นหลังและ Layout --- */
        .bg-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .bg-option { border: 4px solid transparent; border-radius: 10px; cursor: pointer; transition: 0.2s; overflow: hidden; }
        .bg-option.selected { border-color: var(--red-love); transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .bg-option img { width: 100%; display: block; }

        .layout-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .layout-btn {
            background: #fff; border: 2px solid var(--pink-light); border-radius: 8px; padding: 15px 10px; 
            cursor: pointer; font-weight: 700; color: var(--red-love); font-family: 'Mali', cursive; transition: 0.2s;
        }
        .layout-btn:hover { background: var(--pink-bg); transform: translateY(-3px); }

        /* --- กรอบพรีวิวและรูปถ่าย --- */
        .frame-container {
            padding: 30px; background-color: transparent; background-size: cover; background-position: center;
            border-radius: 4px; margin-bottom: 15px; position: relative; min-height: 400px;
        }

        .photo-grid-wrapper {
            position: relative; width: 85%; margin: 0 auto;
        }

        .photo-grid { 
            display: grid; gap: 10px; position: relative; z-index: 2; width: 100%;
        }
        .grid-v2 { grid-template-columns: 1fr; }
        .grid-v4 { grid-template-columns: 1fr; }
        .grid-2x2 { grid-template-columns: 1fr 1fr; }

        .photo-slot { 
            width: 100%; background-color: #eee; background-size: cover; background-position: center; 
            border: 3px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .grid-v2 .photo-slot, .grid-v4 .photo-slot { aspect-ratio: 4/3; }
        .grid-2x2 .photo-slot { aspect-ratio: 1/1; }

        /* --- ของตกแต่ง (ล็อคตำแหน่งมุมรูป) --- */
        .decor {
            position: absolute;
            font-size: 45px;
            z-index: 10;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.3));
            transition: all 0.3s ease;
        }
        .decor-tl { top: -25px; left: -25px; transform: rotate(-15deg); }
        .decor-tr { top: -25px; right: -25px; transform: rotate(15deg); }
        .decor-bl { bottom: -25px; left: -25px; transform: rotate(-15deg); }
        .decor-br { bottom: -25px; right: -25px; transform: rotate(15deg); }

        .decor-options { display: flex; justify-content: space-around; font-size: 2rem; margin: 15px 0; cursor: pointer; }
        .decor-btn { transition: transform 0.2s; }
        .decor-btn:hover { transform: scale(1.3); }

        /* --- จอกล้อง --- */
        .camera-wrapper {
            position: relative; width: 100%; padding-bottom: 133.33%; background: #000; 
            border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 4px solid var(--pink-dark); 
        }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #countdown {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 8rem; 
            color: white; font-weight: 900; text-shadow: 4px 4px 0 var(--red-love); display: none;
        }

        /* --- ปุ่มกดหลัก --- */
        .btn-primary {
            background: linear-gradient(to bottom, var(--pink-dark), var(--red-love)) !important;
            color: white !important; border: 2px solid var(--red-love) !important;
            padding: 12px 20px; border-radius: 8px; font-size: 1.1rem; font-weight: 700;
            cursor: pointer; width: 100%; display: inline-block; box-sizing: border-box; margin-top: 10px; 
            text-decoration: none; box-shadow: 0 4px 0 #8B0000, 0 10px 20px rgba(0,0,0,0.2) !important;
            font-family: 'Mali', cursive; transition: 0.1s;
        }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 0 0 #8B0000 !important; }
        .btn-primary:disabled { background: #ccc !important; border-color: #999 !important; box-shadow: none !important; transform: none !important; }

        .btn-secondary {
            background: transparent; border: none; color: var(--red-love); margin-top: 15px; 
            cursor: pointer; text-decoration: underline; font-weight: 700; font-family: 'Mali', cursive;
        }

        /* --- Result --- */
        #qrcode-area {
            background: #fff; padding: 15px; border-radius: 10px; display: inline-block; 
            margin-bottom: 15px; border: 4px solid var(--pink-light);
        }
        #final-image-show img { width: 100%; border-radius: 8px; margin-bottom: 10px; border: 3px solid var(--pink-dark); }
    </style>
</head>
<body>

    <div class="container">
        <section id="step-welcome" class="active">
            <h1>CVC YOUTH</h1>
            <p>💖 Valentine Photo Booth 2026 💖</p>
            
            <div class="content-box">
                <p style="color:#333; margin-bottom:10px; font-weight:700;">1. เลือกลายพื้นหลัง</p>
                <div class="bg-selector">
                    <div class="bg-option selected" onclick="selectBg(this, '6.jpg')"><img src="6.jpg" alt="Frame 6"></div>
                    <div class="bg-option" onclick="selectBg(this, '7.jpg')"><img src="7.jpg" alt="Frame 7"></div>
                    <div class="bg-option" onclick="selectBg(this, '8.jpg')"><img src="8.jpg" alt="Frame 8"></div>
                    <div class="bg-option" onclick="selectBg(this, '9.jpg')"><img src="9.jpg" alt="Frame 9"></div>
                </div>

                <p style="color:#333; margin-bottom:10px; font-weight:700;">2. เลือกรูปแบบช่องถ่ายรูป</p>
                <div class="layout-selector">
                    <button class="layout-btn" onclick="startCamera('v2', 2)">แนวตั้ง 2 ช่อง</button>
                    <button class="layout-btn" onclick="startCamera('v4', 4)">แนวตั้ง 4 ช่อง</button>
                    <button class="layout-btn" onclick="startCamera('grid', 4)" style="grid-column: span 2;">แนวนอน 4 ช่อง (Grid)</button>
                </div>
            </div>
        </section>

        <section id="step-camera" class="hidden">
            <div class="content-box">
                <div class="camera-wrapper">
                    <video id="video" autoplay playsinline></video>
                    <div id="countdown"></div>
                </div>
                <p id="status-text" style="font-weight: 700; color: var(--red-love);">ยิ้มหวานๆ เตรียมตัว...</p>
            </div>
        </section>

        <section id="step-edit" class="hidden">
            <div class="frame-container" id="preview-container">
                <div class="photo-grid-wrapper">
                    <div id="decor-tl" class="decor decor-tl"></div>
                    <div id="decor-tr" class="decor decor-tr"></div>
                    <div id="decor-bl" class="decor decor-bl"></div>
                    <div id="decor-br" class="decor decor-br"></div>
                    
                    <div id="photo-grid" class="photo-grid"></div>
                </div>
            </div>
            
            <div class="content-box" style="margin-top: 20px;">
                <p style="margin:0; font-weight:700; color:#333;">ตกแต่งด้วยสติกเกอร์ตามมุม</p>
                <div class="decor-options">
                    <span class="decor-btn" onclick="addEmoji('❤️')">❤️</span>
                    <span class="decor-btn" onclick="addEmoji('🌹')">🌹</span>
                    <span class="decor-btn" onclick="addEmoji('🎀')">🎀</span>
                    <span class="decor-btn" onclick="addEmoji('🧸')">🧸</span>
                    <span class="decor-btn" onclick="addEmoji('🍒')">🍒</span>
                    <span class="decor-btn" onclick="addEmoji('')">❌</span>
                </div>
                
                <button class="btn-primary" id="save-btn" onclick="generateFinal()">รับรูปและ QR Code 💌</button>
                <button class="btn-secondary" onclick="location.reload()">เริ่มใหม่</button>
            </div>
        </section>

        <section id="step-result" class="hidden">
            <div class="content-box">
                <h2 style="color:var(--red-love); margin-top:0;">🎉 เสร็จเรียบร้อย!</h2>
                <div id="qrcode-area">
                    <div id="qrcode"></div>
                    <p style="margin:5px 0 0; font-size:1rem; font-weight:700; color: var(--red-love);">สแกนเพื่อรับรูป</p>
                </div>
                <div id="final-image-show"></div>
                <a id="download-link" class="btn-primary">ดาวน์โหลดรูปลงเครื่อง</a>
                <button class="btn-secondary" onclick="location.reload()">ถ่ายรูปใหม่</button>
            </div>
        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        let photos = [];
        let stream = null;
        let selectedBg = '6.jpg';
        let currentLayout = { type: 'v2', count: 2, class: 'grid-v2' };

        function selectBg(element, bgFile) {
            document.querySelectorAll('.bg-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedBg = bgFile;
        }

        async function startCamera(type, count) {
            let gridClass = type === 'grid' ? 'grid-2x2' : (type === 'v4' ? 'grid-v4' : 'grid-v2');
            currentLayout = { type, count, class: gridClass };

            document.getElementById('step-welcome').classList.remove('active');
            document.getElementById('step-welcome').classList.add('hidden');
            document.getElementById('step-camera').classList.remove('hidden');
            document.getElementById('step-camera').classList.add('active');

            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", aspectRatio: 4/3 }, audio: false });
                document.getElementById('video').srcObject = stream;
                startCountdownSequence();
            } catch (e) { 
                alert("ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตให้สิทธิ์การใช้กล้อง"); 
                location.reload(); 
            }
        }

        async function startCountdownSequence() {
            photos = [];
            const cd = document.getElementById('countdown');
            
            for (let i = 1; i <= currentLayout.count; i++) {
                document.getElementById('status-text').innerText = `รูปที่ ${i} / ${currentLayout.count}`;
                
                await new Promise(r => {
                    let c = 3; 
                    cd.innerText = c; 
                    cd.style.display = 'block';
                    
                    const t = setInterval(() => { 
                        c--; 
                        if(c > 0) {
                            cd.innerText = c; 
                        } else { 
                            clearInterval(t); 
                            cd.innerText = "📸"; 
                            r(); 
                        } 
                    }, 1000);
                });

                capturePhoto();
                cd.style.display = 'none';
                if (i < currentLayout.count) await new Promise(r => setTimeout(r, 800));
            }

            if(stream) stream.getTracks().forEach(t => t.stop());
            setupPreview();
        }

        function capturePhoto() {
            const v = document.getElementById('video');
            const c = document.createElement('canvas');
            c.width = v.videoWidth; c.height = v.videoHeight;
            const ctx = c.getContext('2d');
            ctx.translate(c.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(v, 0, 0);
            photos.push(c.toDataURL('image/png'));
        }

        function setupPreview() {
            document.getElementById('step-camera').classList.remove('active');
            document.getElementById('step-camera').classList.add('hidden');
            document.getElementById('step-edit').classList.remove('hidden');
            document.getElementById('step-edit').classList.add('active');

            const container = document.getElementById('preview-container');
            container.style.backgroundImage = `url(${selectedBg})`;

            const grid = document.getElementById('photo-grid');
            grid.className = 'photo-grid ' + currentLayout.class; 
            grid.innerHTML = '';
            
            photos.forEach(src => {
                const d = document.createElement('div');
                d.className = 'photo-slot'; 
                d.style.backgroundImage = `url(${src})`;
                grid.appendChild(d);
            });

            addEmoji('❤️');
        }

        function addEmoji(emojiChar) {
            document.getElementById('decor-tl').innerText = emojiChar;
            document.getElementById('decor-tr').innerText = emojiChar;
            document.getElementById('decor-bl').innerText = emojiChar;
            document.getElementById('decor-br').innerText = emojiChar;
        }

        async function generateFinal() {
            const btn = document.getElementById('save-btn');
            const oldText = btn.innerText;
            btn.innerText = "กำลังสร้างรูปภาพ... ⏳"; 
            btn.disabled = true;

            try {
                const canvas = await html2canvas(document.getElementById('preview-container'), { scale: 3, useCORS: true });
                const imageData = canvas.toDataURL('image/png');

                document.getElementById('step-edit').classList.remove('active');
                document.getElementById('step-edit').classList.add('hidden');
                document.getElementById('step-result').classList.remove('hidden');
                document.getElementById('step-result').classList.add('active');

                document.getElementById('final-image-show').innerHTML = `<img src="${imageData}">`;
                
                const link = document.getElementById('download-link');
                link.href = imageData; 
                link.download = `CVC_Valentine_${Date.now()}.png`;

                new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 160, height: 160, colorDark : "#c9184a", colorLight : "#ffffff" });

            } catch (e) {
                alert("เกิดข้อผิดพลาดในการสร้างรูป: " + e.message);
                btn.innerText = oldText; 
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
